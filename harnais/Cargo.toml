[package]
name = "harnais"
version = "1.1.0"
edition = "2021"

[[bin]]
name = "harnais"
path = "src/main.rs"

[dependencies]
# `preserve_order` : les fichiers d'état sont écrits par Python avec
# `json.dumps(indent=1)`, qui garde l'ORDRE D'INSERTION. Sans ce drapeau
# serde_json trierait les clés, et les deux versions n'écriraient pas le même
# fichier — la comparaison ne serait plus à l'octet.
serde_json = { version = "1", features = ["preserve_order"] }
serde = "1"
sha1 = "0.10"
unicode-normalization = "0.1"
regex = "1"
fancy-regex = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
